services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_AMANAHADS_INSTANCE_KEY: ${NEXT_PUBLIC_AMANAHADS_INSTANCE_KEY:-}
        NEXT_PUBLIC_AADS_ENABLED: ${NEXT_PUBLIC_AADS_ENABLED:-false}
        NEXT_PUBLIC_AADS_UNIT_ID: ${NEXT_PUBLIC_AADS_UNIT_ID:-}
        NEXT_PUBLIC_AADS_UNIT_SIZE: ${NEXT_PUBLIC_AADS_UNIT_SIZE:-Adaptive}
        NEXT_PUBLIC_COINZILLA_ENABLED: ${NEXT_PUBLIC_COINZILLA_ENABLED:-false}
        NEXT_PUBLIC_COINZILLA_ZONE_ID: ${NEXT_PUBLIC_COINZILLA_ZONE_ID:-}
        NEXT_PUBLIC_COINTRAFFIC_ENABLED: ${NEXT_PUBLIC_COINTRAFFIC_ENABLED:-false}
        NEXT_PUBLIC_COINTRAFFIC_TAG_SRC: ${NEXT_PUBLIC_COINTRAFFIC_TAG_SRC:-}
        NEXT_PUBLIC_COINTRAFFIC_ZONE_ID: ${NEXT_PUBLIC_COINTRAFFIC_ZONE_ID:-}
        NEXT_PUBLIC_PROPELLERADS_ENABLED: ${NEXT_PUBLIC_PROPELLERADS_ENABLED:-false}
        NEXT_PUBLIC_PROPELLERADS_TAG_SRC: ${NEXT_PUBLIC_PROPELLERADS_TAG_SRC:-}
        NEXT_PUBLIC_PROPELLERADS_ZONE_ID: ${NEXT_PUBLIC_PROPELLERADS_ZONE_ID:-}
        NEXT_PUBLIC_MONETAG_ENABLED: ${NEXT_PUBLIC_MONETAG_ENABLED:-false}
        NEXT_PUBLIC_MONETAG_TAG_SRC: ${NEXT_PUBLIC_MONETAG_TAG_SRC:-}
        NEXT_PUBLIC_MONETAG_ZONE_ID: ${NEXT_PUBLIC_MONETAG_ZONE_ID:-}
        NEXT_PUBLIC_BITMEDIA_ENABLED: ${NEXT_PUBLIC_BITMEDIA_ENABLED:-false}
        NEXT_PUBLIC_BITMEDIA_PLACEMENT_ID: ${NEXT_PUBLIC_BITMEDIA_PLACEMENT_ID:-}
        NEXT_PUBLIC_BITMEDIA_WIDTH: ${NEXT_PUBLIC_BITMEDIA_WIDTH:-970}
        NEXT_PUBLIC_BITMEDIA_HEIGHT: ${NEXT_PUBLIC_BITMEDIA_HEIGHT:-90}
        NEXT_PUBLIC_PROFITON_DOMAIN_VERIFICATION: ${NEXT_PUBLIC_PROFITON_DOMAIN_VERIFICATION:-}
    ports: ["3000:3000"]
    depends_on: [backend]
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: .env
    depends_on: [postgres, redis]
  worker:
    build: ./backend
    command: python -m app.workers.placeholder
    env_file: .env
    depends_on: [postgres, redis]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workbit
      POSTGRES_USER: workbit
      POSTGRES_PASSWORD: workbit
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    volumes: ["redis-data:/data"]
volumes:
  postgres-data:
  redis-data:
